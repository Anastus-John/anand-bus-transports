<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anand Bus Transports | Admin Operations Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-gray-100 font-sans min-h-screen">

    <header class="bg-slate-950 border-b border-slate-800 text-white sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide text-amber-400">🚍 ANAND BUS TRANSPORTS — ADMIN DASHBOARD</h1>
                <p class="text-xs text-gray-400">Live Operations & Trip Enquiries Feed</p>
            </div>
            <div class="flex items-center space-x-3">
                <button id="enablePushBtn" onclick="enablePushNotifications()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow">
                    🔔 Enable Live System Push Alerts
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs font-semibold text-gray-400 uppercase">Total Requests</p>
                <p id="statTotal" class="text-2xl font-black text-white mt-1">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs font-semibold text-amber-400 uppercase">Pending Quotes</p>
                <p id="statPending" class="text-2xl font-black text-amber-400 mt-1">0</p>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-xs font-semibold text-emerald-400 uppercase">System Status</p>
                <div class="flex items-center space-x-2 mt-2">
                    <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
                    <span class="text-xs font-bold text-emerald-400">ENGINE LIVE</span>
                </div>
            </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="bg-slate-900 px-6 py-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-white text-sm">Real-time Bookings Master Feed</h3>
                <span class="text-xs text-gray-400">Auto-updated via Server-Sent Events</span>
            </div>
            <div id="bookingFeed" class="p-4 space-y-3 max-h-[600px] overflow-y-auto">
                <p class="text-xs text-center text-gray-400 py-10">Loading system bookings...</p>
            </div>
        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
